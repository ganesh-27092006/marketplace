<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - MarketHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Navbar -->

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                <i class="fa-solid fa-bag-shopping"></i>
                Market<span>Hub</span>
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
            </div>

            <div class="nav-icons">
                <button onclick="window.location.href='cart.html'">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count">0</span>
                </button>

                <button class="login-btn">Login</button>
            </div>

        </nav>
    </header>


    <!-- Checkout Hero -->

    <section class="checkout-hero">

        <p>HOME / CART / CHECKOUT</p>

        <h1>Secure Checkout 🔒</h1>

        <span>Complete your details and place your order</span>

    </section>


    <!-- Checkout -->

    <section class="checkout-container">


        <!-- Customer Form -->

        <div class="checkout-form-section">

            <div class="checkout-card">

                <h2>
                    <i class="fa-solid fa-user"></i>
                    Customer Information
                </h2>


                <div class="form-row">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Enter your full name"
                        >

                    </div>


                    <div class="form-group">

                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            id="customerMobile"
                            placeholder="Enter mobile number"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="Enter email address"
                    >

                </div>

            </div>


            <!-- Address -->

            <div class="checkout-card">

                <h2>
                    <i class="fa-solid fa-location-dot"></i>
                    Delivery Address
                </h2>


                <div class="form-group">

                    <label>Full Address</label>

                    <textarea
                        id="customerAddress"
                        placeholder="House No, Street, Area..."
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>City</label>

                        <input
                            type="text"
                            id="customerCity"
                            placeholder="Enter city"
                        >

                    </div>


                    <div class="form-group">

                        <label>Pincode</label>

                        <input
                            type="text"
                            id="customerPincode"
                            placeholder="Enter pincode"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>State</label>

                    <input
                        type="text"
                        id="customerState"
                        placeholder="Enter state"
                    >

                </div>

            </div>


            <!-- Payment -->

            <div class="checkout-card">

                <h2>
                    <i class="fa-solid fa-credit-card"></i>
                    Payment Method
                </h2>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="COD"
                        checked
                    >

                    <span class="payment-icon">
                        💵
                    </span>

                    <span>
                        <b>Cash on Delivery</b>
                        <small>Pay when your order arrives</small>
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="UPI"
                    >

                    <span class="payment-icon">
                        📱
                    </span>

                    <span>
                        <b>UPI Payment</b>
                        <small>Pay using Google Pay, PhonePe etc.</small>
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="Card"
                    >

                    <span class="payment-icon">
                        💳
                    </span>

                    <span>
                        <b>Credit / Debit Card</b>
                        <small>Secure card payment</small>
                    </span>

                </label>

            </div>

        </div>


        <!-- Order Summary -->

        <aside class="checkout-summary">

            <h2>Your Order</h2>


            <div id="checkoutItems">

                <!-- JavaScript -->

            </div>


            <hr>


            <div class="checkout-row">

                <span>Subtotal</span>

                <b id="checkoutSubtotal">
                    ₹0
                </b>

            </div>


            <div class="checkout-row">

                <span>Delivery</span>

                <b class="free-delivery">
                    FREE
                </b>

            </div>


            <hr>


            <div class="checkout-total">

                <span>Total</span>

                <b id="checkoutTotal">
                    ₹0
                </b>

            </div>


            <button
                class="place-order-btn"
                onclick="placeOrder()"
            >

                <i class="fa-solid fa-lock"></i>

                Place Secure Order

            </button>


            <div class="checkout-security">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    100% Secure Checkout
                </span>

            </div>

        </aside>

    </section>


    <!-- Footer -->

    <footer>

        <div class="copyright">
            © 2026 MarketHub. All Rights Reserved.
        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
